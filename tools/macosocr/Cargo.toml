[package]
name = "macosocr"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "用 macOS Vision 离线 OCR 实现 rpa_llm 的本地 OCR 契约（PNG stdin → JSON stdout）"

# 继承 workspace 的 lint 配置（根 Cargo.toml 的 [workspace.lints.clippy]）。
# ⚠️ 少了这一段，workspace 里设的 `too_many_arguments = "deny"` 等**完全不生效**
# —— 2026-09-29 实测：12 个 crate 全缺这一段，导致 lints 白设。
[lints]
workspace = true


[[bin]]
name = "macosocr"
path = "src/main.rs"
