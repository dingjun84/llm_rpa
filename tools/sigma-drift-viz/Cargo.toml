[package]
name = "sigma-drift-viz"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mac-first (Win-ready) eframe/egui trajectory visualizer for sigma-drift"

# 继承 workspace 的 lint 配置（根 Cargo.toml 的 [workspace.lints.clippy]）。
# ⚠️ 少了这一段，workspace 里设的 `too_many_arguments = "deny"` 等**完全不生效**
# —— 2026-09-29 实测：12 个 crate 全缺这一段，导致 lints 白设。
[lints]
workspace = true


[[bin]]
name = "sigma-drift-viz"
path = "src/main.rs"

[dependencies]
sigma-drift = { path = "../../crates/sigma-drift" }
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.31"
rfd = "0.15"
serde = { workspace = true }
serde_json = { workspace = true }

# GhostBox in-process HID relative replay (Windows DLL; crate itself is cfg-light).
# Always depend so Mac builds still compile the module stubs; DLL calls are
# behind `cfg(windows)` in `gb_replay.rs`.
ghostbox = { path = "../../crates/ghostbox" }

# HID: macOS IOKit FFI (platform/macos.rs); Windows Raw Input + message-only
# HWND (platform/windows.rs). No extra crates — thin system FFI only.
