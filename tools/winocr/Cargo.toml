[package]
name = "winocr"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "用 Windows 内置离线 OCR 引擎实现 rpa_llm 的本地 OCR 契约（PNG stdin → JSON stdout）"

# 继承 workspace 的 lint 配置（根 Cargo.toml 的 [workspace.lints.clippy]）。
# ⚠️ 少了这一段，workspace 里设的 `too_many_arguments = "deny"` 等**完全不生效**
# —— 2026-09-29 实测：12 个 crate 全缺这一段，导致 lints 白设。
[lints]
workspace = true


[[bin]]
name = "winocr"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
] }
