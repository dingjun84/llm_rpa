[package]
name = "replay"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "离线重放过程诊断事件流：拿盘上记下的那一帧重跑判据，回答「它为什么这么判」"

# 继承 workspace 的 lint 配置（根 Cargo.toml 的 [workspace.lints.clippy]）。
# ⚠️ 少了这一段，workspace 里设的 `too_many_arguments = "deny"` 等**完全不生效**
# —— 2026-09-29 实测：12 个 crate 全缺这一段，导致 lints 白设。
[lints]
workspace = true


[lib]
name = "replay"
path = "src/lib.rs"

[[bin]]
name = "replay"
path = "src/main.rs"

[dependencies]
automation-core = { path = "../../crates/automation-core" }
# 真 OCR 模式要起本机引擎：引擎的调用与 stdout 解析只有 `vision` 一处实现，
# 自己再写一套会让"两次读数"的差异里混进"两个解析器的差异"。
vision = { path = "../../crates/vision" }
serde_json.workspace = true