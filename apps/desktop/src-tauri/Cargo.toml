[package]
name = "desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "desktop_lib"
crate-type = ["lib"]

[features]
# Tauri 官方模板里自带这一项，注释原文是 "DO NOT REMOVE"。
#
# 它决定前端资源**是否嵌进二进制**：
#   tauri/build.rs      →  dev = !has_feature("custom-protocol")
#   tauri-codegen        →  if dev && devUrl.is_some() { 资源留空 }
# 也就是说：**没有这个 feature 时，`cargo build` 出来的 exe 里一个前端文件都没有**，
# 运行期只能去 `devUrl`（http://localhost:1420）取页面 ——
# dev 服务器不在，窗口就是白的（WebView2 起了、导航失败、什么都没有）。
#
# 加上它之后 `cargo build -p desktop --features custom-protocol` 才能产出
# 可独立双击运行的 exe。`tauri build` 走的就是这条路。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
automation-core = { path = "../../../crates/automation-core" }
platform-mock = { path = "../../../crates/platform-mock" }
storage = { path = "../../../crates/storage" }
vision = { path = "../../../crates/vision" }
# `protocol-asset`：让界面能通过 Tauri 的 asset 协议直接读盘上的图。
#
# 「过程重放」要显示那一步的原图（`data/tasks/<任务ID>/steps/*.png`）。
# 不用它就得把 PNG 读成 base64 从 IPC 回传：一张 200KB 的图变成 270KB 的字符串，
# 逐帧翻看时这点开销全压在 IPC 上。asset 协议由 WebView 自己去取，只走 URL。
tauri = { version = "2.0.0", features = ["protocol-asset"] }
tauri-plugin-opener = "2.0.0"
# 仅用于把标定预览的 PNG 以 base64 回传给界面。
base64 = "0.22"
# 任务日志的时间戳要本地可读（`task_log::now_stamp`）。
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
platform-windows = { path = "../../../crates/platform-windows" }

[target.'cfg(target_os = "macos")'.dependencies]
platform-macos = { path = "../../../crates/platform-macos" }

[dev-dependencies]
# `test` 特性提供 `tauri::test::mock_builder` / `MockRuntime`，
# 让命令层可以在不启动真实窗口的前提下被自动化验证。
tauri = { version = "2.0.0", features = ["test"] }
