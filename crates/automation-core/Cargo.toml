[package]
name = "automation-core"
version.workspace = true
edition.workspace = true
license.workspace = true

# 继承 workspace 的 lint 配置（根 Cargo.toml 的 [workspace.lints.clippy]）。
# ⚠️ 少了这一段，workspace 里设的 `too_many_arguments = "deny"` 等**完全不生效**
# —— 2026-09-29 实测：12 个 crate 全缺这一段，导致 lints 白设。
[lints]
workspace = true


[dependencies]
thiserror.workspace = true
uuid.workspace = true
serde.workspace = true
sha2.workspace = true
