[package]
name = "platform-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "macOS 平台适配层：窗口定位、截屏、受保护的鼠标键盘与剪贴板"

# 继承 workspace 的 lint 配置（根 Cargo.toml 的 [workspace.lints.clippy]）。
# ⚠️ 少了这一段，workspace 里设的 `too_many_arguments = "deny"` 等**完全不生效**
# —— 2026-09-29 实测：12 个 crate 全缺这一段，导致 lints 白设。
[lints]
workspace = true


[dependencies]
automation-core = { path = "../automation-core" }
sha2.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = { version = "0.24", features = ["highsierra"] }
objc = "0.2"
libc = "0.2"
