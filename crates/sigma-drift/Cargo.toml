[package]
name = "sigma-drift"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SigmaDrift motor-synergy trajectory generator (sigma-lognormal + OU tremor)"

# 继承 workspace 的 lint 配置（根 Cargo.toml 的 [workspace.lints.clippy]）。
# ⚠️ 少了这一段，workspace 里设的 `too_many_arguments = "deny"` 等**完全不生效**
# —— 2026-09-29 实测：12 个 crate 全缺这一段，导致 lints 白设。
[lints]
workspace = true


[dependencies]
rand = "0.8"
rand_distr = "0.4"
