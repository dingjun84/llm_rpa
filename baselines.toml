# 存量超标基线（机器可读，唯一来源）
#
# 为什么有这份文件：`CONVENTIONS.md` §9 曾把基线写在散文表格里，
# 结果同一个文件在不同段落出现多个互相矛盾的数字（手抄必然漂移）。
# 这里改成**唯一来源**：门禁脚本读它、CI 读它，`CONVENTIONS.md` 只解释规矩。
#
# 规矩：
#   - 生产文件上限 500 行（不含 tests/ 、examples/ 、*tests.rs）
#   - 下表是 2026-09-29 实测的存量超标文件。**只许减，不许增**。
#   - 改完代码若某文件超过它的基线 ⇒ 门禁拦下，逼你就地拆分
#     （做法照抄 CONVENTIONS.md §9 的「先搬出一段自成一类的功能」）。
#   - 拆分后**顺手把这里的数字改小**；彻底降到 500 以下就把整行删掉。
#   - 新增文件一律受 500 行上限约束，**不进这张表**（不许给新代码开口子）。

[limits]
# 生产文件硬上限
production_max_lines = 500
# 测试文件上限（测试文件刻意放宽；设一个值防止测试本身失控）
test_max_lines = 3000

# 文件名 = 相对仓库根的正斜杠路径；值 = 当前允许的最大行数（只许往下调）
#
# 2026-09-29 的调整记录（唯一一次上调，理由必须像下面这样写清）：
#   · `lib.rs` 2201 → 2210（+9）、`vision/src/template.rs` 904 → 917（+13）
#     涨的全是 **TODO(Tn) 债务锚点注释**，不是新功能。这是把「债务只存在于
#     文档」改成「债务锚在代码现场」的一次性治理投入——锚点让 AI 改到这段
#     代码时能看见已知债务，代价是几行注释。
#   · `crates/sigma-drift/src/lib.rs` 580 → 585（+5）：同上，给 `generate_with`
#     补 `#[allow(clippy::too_many_arguments)]`（让存量代码不阻塞新开的 deny）
#     + TODO(T17) 锚点说明「为什么这里允许、新代码不许照抄」。
#   · 除此之外**任何上调都必须先拆分**。门禁只认可下不认可上的默认纪律。
